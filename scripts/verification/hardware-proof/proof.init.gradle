// Explicit opt-in packaging only. Ordinary Gradle/IDE builds never load this file.
import org.gradle.api.GradleException
def runId = gradle.startParameter.projectProperties['hardwareProofRun']
if (!(runId ==~ /[a-f0-9]{32}/)) throw new GradleException('Exact fresh hardware proof ID required')
def repo = new File('C:/Users/Dominik/AndroidStudioProjects/CardVault').canonicalFile
def proof = new File(repo, 'scripts/verification/hardware-proof').canonicalFile
def output = new File(repo, 'artifacts/release27-engineering-20261003/hardware-proof/' + runId).canonicalFile
if (!new File(output, 'before.json').isFile()) throw new GradleException('Preservation snapshot required')
if (new File(repo, 'keystore.properties').exists() || System.getenv().keySet().any { it.startsWith('DOMIDEX_UPLOAD_') }) {
    throw new GradleException('No release/upload credentials')
}
if (gradle.startParameter.taskNames != [':app:assembleDebug', ':app:assembleDebugAndroidTest'] ||
    !gradle.startParameter.offline) throw new GradleException('Only offline isolated debug APK pair')
gradle.beforeProject { project ->
    project.layout.buildDirectory.set(new File(output, project.path == ':app' ? 'app-build' : 'root-build'))
    if (project.path == ':app') {
        project.plugins.withId('com.android.application') {
            project.extensions.getByName('androidComponents').finalizeDsl { android ->
                android.defaultConfig.applicationId = 'com.dominik.cardvault.hardwareproof.r' + runId
                android.defaultConfig.testApplicationId = 'com.dominik.cardvault.hardwareproof.r' + runId + '.test'
                android.defaultConfig.testInstrumentationRunner = 'com.dominik.cardvault.HardwareProofRunner'
                android.defaultConfig.buildConfigField('boolean', 'DOMIDEX_APP_CHECK_ENABLED', 'false')
                android.sourceSets.getByName('debug').manifest.srcFile(new File(proof, 'AndroidManifest.xml'))
                android.sourceSets.getByName('debug').res.srcDir(new File(proof, 'res'))
                android.sourceSets.getByName('androidTest').manifest.srcFile(new File(proof, 'AndroidTestManifest.xml'))
                android.sourceSets.getByName('androidTest').java.setSrcDirs([new File(proof, 'androidTest'), new File(output, 'injected-source')])
                android.sourceSets.getByName('androidTest').kotlin.setSrcDirs([new File(proof, 'androidTest'), new File(output, 'injected-source')])
                android.sourceSets.getByName('androidTest').assets.setSrcDirs([])
            }
        }
        project.tasks.configureEach { task -> if (task.name == 'processDebugGoogleServices') task.enabled = false }
    }
}
gradle.projectsEvaluated {
    if (gradle.rootProject.projectDir.canonicalFile != repo) throw new GradleException('Wrong repository')
    def android = gradle.rootProject.project(':app').extensions.getByName('android')
    if (android.defaultConfig.applicationId != 'com.dominik.cardvault.hardwareproof.r' + runId ||
        android.defaultConfig.testApplicationId != 'com.dominik.cardvault.hardwareproof.r' + runId + '.test') {
        throw new GradleException('Not isolated')
    }
    if (android.buildTypes.getByName('debug').signingConfig?.name != 'debug' ||
        android.signingConfigs.findByName('release') != null) throw new GradleException('Standard debug key only')
    if (!android.buildTypes.getByName('release').minifyEnabled) throw new GradleException('R8 must stay enabled')
}
gradle.taskGraph.whenReady { graph ->
    def forbidden = graph.allTasks.findAll { task ->
        task.project.path != ':app' || task.name.toLowerCase().matches('.*(release|install|publish|upload|connected|clean).*') ||
        (task.name.toLowerCase().contains('bundle') && !(task.name in ['bundleDebugClassesToCompileJar', 'bundleDebugClassesToRuntimeJar']))
    }
    if (!forbidden.empty) throw new GradleException('Forbidden task: ' + forbidden*.path)
    println('DOMIDEX_HARDWARE_PROOF debugOnly=true isolatedPackage=true plainApplication=true network=false camera=false')
}
